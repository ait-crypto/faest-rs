[package]
name = "faest-benches"
version = "0.1.0"
publish = false
license = "Apache-2.0 OR MIT"
edition = "2024"
rust-version = "1.88"

[dependencies]
faest = { path = "../", default-features = false, features = [
  "randomized-signer",
] }

zeroize = { version = "=1.9.1", optional = true, default-features = false }

[features]
default = ["faest/opt-simd", "faest/opt-batch"]
zeroize = ["faest/zeroize"]
explicit-bzero = ["zeroize", "zeroize/explicit-bzero"]

[dev-dependencies]
nist-pqc-seeded-rng = {version = "0.4", default-features = false}
rand = "0.10"
criterion = "0.8"

[lib]
test = false
doc = false
doctest = false

[workspace]
exclude = ["zeroize"]

[patch.crates-io]
zeroize = { path = "zeroize" }

[profile.bench]
lto = "fat"

[[bench]]
name = "faest-bench"
path = "benches/bench.rs"
harness = false
test = false
